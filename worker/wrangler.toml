name = "icecream-tracker"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "icecream"
database_id = "b81879e6-bf63-4e81-a07e-f84db0639962"

# Full-size scrapbook photos (originals + small previews). Private: served only via the Worker.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "icecream-photos"

[vars]
# Only the live page may call the API from a browser. (The local demo goes through
# dev/serve.py, which calls the Worker server-side, so it needs no entry here.)
ALLOWED_ORIGINS = "https://alimuneeb24.github.io"

# PIN_MUNEEB and PIN_FIZA are secrets: .dev.vars locally, `wrangler secret put` in production.

# 🎮 Scoop Stack: settle last week's race just after midnight Karachi time
# (19:05 UTC; it only finds one to settle on Monday), the "new race" ping at 10 am
# Monday (05:00 UTC), and the Sunday last-day reminder at 6 pm (13:00 UTC).
# The 10 am run also sends the daytime nudges (6 pm retries if it was missed).
[triggers]
crons = ["5 19 * * *", "0 5 * * *", "0 13 * * *"]

# Cloudflare's own request logs (errors and crashes, kept a few days). The permanent
# who-did-what log is the activity_log table: `npm run logs`.
[observability]
enabled = true
